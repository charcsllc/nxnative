# The ahead-of-time recompiler nxaot (dm/tools/aot, Phase 2 of the port: docs/design/migration-status.md): its Docker image, its build, the corpus
# rebuilt with both toolchains, CTest and the test runner that writes logs/aot/ (the vector harness, discovery over the corpus, the corpus
# recompiled and run natively, the per-function differential test, the benchmarks), with the commands of dm/tools/aot/README.md. Nothing here
# builds or runs a game.
name: aot

on:
  pull_request:
  push:
    branches: [main, multiplataforma]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aot-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

# Actions are pinned to commit SHAs (the tag in the comment), the same as port.yml: a tag can be moved, a SHA cannot
jobs:
  nxaot:
    name: nxaot build, vector harness and census (Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the image
        run: docker build -t nxnative-aot -f docker/Dockerfile.aot docker
      - name: Configure and build (build/aot)
        id: build
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$(pwd):/src" -w /src nxnative-aot sh -c \
            "cmake -S dm/tools/aot -B build/aot -G Ninja -DCMAKE_BUILD_TYPE=Release && cmake --build build/aot"
      # The corpus (dm/tools/aot/corpus): every program built again with devkitA64's GCC (the devkitpro/devkita64 image, pinned by digest in
      # build_corpus.sh, pulled on every run and not cached: about 700 MB, a minute or two) and with clang-18, the NROs compared byte for byte with
      # the committed ones and with what devkitPro's elf2nro writes
      - name: Corpus rebuild (devkitA64 and clang, byte for byte)
        run: sh dm/tools/aot/corpus/build_corpus.sh --check
      # Time budget: the committed vectors (179,296, most of them floating point and SIMD) take about 4 minutes on an 8-thread machine, and they run
      # once, in the runner, which logs them; CTest runs the other tests (the crypto vectors for x86-64-v3, the per-operation NaN mode, the reach
      # check, the census, the vectors-current check, discovery over the corpus, the manifest test, the corpus reference run under dynarmic, and
      # phase 1's corpus_native, the 14 NROs recompiled in 4 configurations and run natively, about 45 s on that machine, and corpus_funcdiff,
      # every function of every NRO against dynarmic in two modes, about 100 s; the runner repeats both, and its benchmark adds about 3 minutes).
      # Should the job outgrow its budget, trim the committed set (words_per_entry and seeds_per_word in dm/tools/aot/tests/gen_fp_simd.py), not
      # the classes it covers
      - name: CTest (all but the full vector run)
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$(pwd):/src" -w /src nxnative-aot \
            ctest --test-dir build/aot --output-on-failure -E '^vectors$'
      - name: Test runner (logs/aot)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$(pwd):/src" -w /src nxnative-aot \
            sh dm/tools/aot/tests/run_aot_tests.sh build/aot
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: logs-aot
          path: logs/aot
          if-no-files-found: ignore
          retention-days: 7
