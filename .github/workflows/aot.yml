# The ahead-of-time recompiler nxaot (dm/tools/aot, Phase 2 of the port: docs/design/migration-status.md): its Docker image, its build, CTest and the
# test runner that writes logs/aot/, with the commands of dm/tools/aot/README.md. Nothing here builds or runs a game.
name: aot

on:
  pull_request:
  push:
    branches: [main, multiplataforma]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aot-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

# Actions are pinned to commit SHAs (the tag in the comment), the same as port.yml: a tag can be moved, a SHA cannot
jobs:
  nxaot:
    name: nxaot build, vector harness and census (Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the image
        run: docker build -t nxnative-aot -f docker/Dockerfile.aot docker
      - name: Configure and build (build/aot)
        id: build
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$(pwd):/src" -w /src nxnative-aot sh -c \
            "cmake -S dm/tools/aot -B build/aot -G Ninja -DCMAKE_BUILD_TYPE=Release && cmake --build build/aot"
      - name: CTest
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$(pwd):/src" -w /src nxnative-aot \
            ctest --test-dir build/aot --output-on-failure
      - name: Test runner (logs/aot)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$(pwd):/src" -w /src nxnative-aot \
            sh dm/tools/aot/tests/run_aot_tests.sh build/aot
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: logs-aot
          path: logs/aot
          if-no-files-found: ignore
          retention-days: 7
